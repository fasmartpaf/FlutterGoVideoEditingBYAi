<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FlutterGo.AI</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; font-family: ui-sans-serif, system-ui, sans-serif; background: #070b16; color: #eef2ff; }
      .shell { min-height: 100%; display: grid; place-items: center; padding: 48px 24px; background:
        radial-gradient(1200px 600px at 20% 0%, #1d4ed855, transparent 55%),
        radial-gradient(900px 500px at 90% 20%, #7c3aed40, transparent 50%), #070b16; }
      .card { width: min(720px, 92vw); border: 1px solid #2a3558; border-radius: 28px; padding: 36px 40px 40px; background: #0c1224cc; box-shadow: 0 30px 80px #0008; }
      .kicker { letter-spacing: 0.18em; text-transform: uppercase; color: #93c5fd; font-size: 12px; margin: 0 0 12px; }
      h1 { margin: 0 0 12px; font-size: 48px; letter-spacing: -0.04em; }
      p { margin: 0 0 28px; color: #c7d2fe; font-size: 18px; line-height: 1.5; }
      .row { display: flex; gap: 12px; flex-wrap: wrap; }
      button { border: 0; border-radius: 999px; padding: 12px 18px; font-weight: 650; cursor: pointer; }
      .primary { background: #2563eb; color: white; }
      .ghost { background: #1e293b; color: #dbeafe; }
    </style>
  </head>
  <body>
    <div class="shell">
      <main class="card">
        <p class="kicker">FlutterGo.AI demo</p>
        <h1>Build the app. Ship the demo.</h1>
        <p>Describe a screen in chat. FlutterGo lays out the Flutter UI. OpenScreen records the walkthrough and polishes the video.</p>
        <div class="row">
          <button class="primary">Create login page</button>
          <button class="ghost">Open Studio</button>
        </div>
      </main>
    </div>
  </body>
</html>
